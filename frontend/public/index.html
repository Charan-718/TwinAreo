<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#4c4c4c" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="TwinAero: an uncertainty-aware, self-calibrating digital twin for turbofan engine health, evaluated on NASA C-MAPSS FD004." />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>TwinAero · Engine health digital twin</title>
    <script>
      // Resolve the theme before first paint so there is no theme flash.
      (function () {
        try {
          var stored = localStorage.getItem('twinaero-theme');
          var pref = stored === 'light' || stored === 'dark' ? stored : 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          var link = document.querySelector("link[rel*='icon']");
          if (link) {
            link.href = dark ? '%PUBLIC_URL%/favicon-dark.svg' : '%PUBLIC_URL%/favicon-light.svg';
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <noscript>TwinAero needs JavaScript to display engine data.</noscript>
    <div id="root"></div>
  </body>
</html>
