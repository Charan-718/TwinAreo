<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <style>
    .fav-drone-light { display: none; }
    .fav-drone-dark { display: block; }
    @media (prefers-color-scheme: light) {
      .fav-drone-light { display: block; }
      .fav-drone-dark { display: none; }
    }
  </style>
  <defs>
    <filter id="drone-glow-dark" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="drone-shadow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.8" flood-color="#0f172a" flood-opacity="0.2" />
    </filter>

    <linearGradient id="drone-core-dark" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="35%" stop-color="#ffb703" />
      <stop offset="75%" stop-color="#ffd000" />
      <stop offset="100%" stop-color="#ffff0d" />
    </linearGradient>

    <linearGradient id="drone-core-light" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- DARK MODE DRONE FAVICON (TRANSPARENT BACKGROUND) -->
  <g class="fav-drone-dark">
    <g filter="url(#drone-glow-dark)">
      <path d="M 18,6.5 A 11.5,11.5 0 0,0 6.5,18 A 11.5,11.5 0 0,0 18,29.5" fill="none" stroke="#ffff0d" stroke-width="2.6" stroke-linecap="round" />
      <path d="M 18,10.5 A 7.5,7.5 0 0,0 10.5,18 A 7.5,7.5 0 0,0 18,25.5" fill="none" stroke="#ff7b00" stroke-width="2" stroke-linecap="round" />
      <path d="M 46,6.5 A 11.5,11.5 0 0,1 57.5,18 A 11.5,11.5 0 0,1 46,29.5" fill="none" stroke="#ffff0d" stroke-width="2.6" stroke-linecap="round" />
      <path d="M 46,10.5 A 7.5,7.5 0 0,1 53.5,18 A 7.5,7.5 0 0,1 46,25.5" fill="none" stroke="#ff7b00" stroke-width="2" stroke-linecap="round" />
      <path d="M 46,57.5 A 11.5,11.5 0 0,0 57.5,46 A 11.5,11.5 0 0,0 46,34.5" fill="none" stroke="#ffff0d" stroke-width="2.6" stroke-linecap="round" />
      <path d="M 46,53.5 A 7.5,7.5 0 0,0 53.5,46 A 7.5,7.5 0 0,0 46,38.5" fill="none" stroke="#ff7b00" stroke-width="2" stroke-linecap="round" />
      <path d="M 18,57.5 A 11.5,11.5 0 0,1 6.5,46 A 11.5,11.5 0 0,1 18,34.5" fill="none" stroke="#ffff0d" stroke-width="2.6" stroke-linecap="round" />
      <path d="M 18,53.5 A 7.5,7.5 0 0,1 10.5,46 A 7.5,7.5 0 0,1 18,38.5" fill="none" stroke="#ff7b00" stroke-width="2" stroke-linecap="round" />
    </g>

    <path d="M 20,16 L 24,19 Q 32,25 40,19 L 44,16 Q 48,20 45,24 Q 39,32 45,40 Q 48,44 44,48 L 40,45 Q 32,39 24,45 L 20,48 Q 16,44 19,40 Q 25,32 19,24 Q 16,20 20,16 Z"
          fill="#141518" stroke="#ffb703" stroke-width="1.5" stroke-linejoin="round" filter="url(#drone-glow-dark)" />
    <path d="M 22,18 C 24.5,21 30,25.5 32,25.5 C 34,25.5 39.5,21 42,18 C 43.5,20.5 40.5,27 38.5,29.5 C 41.5,31.5 45.5,30 45,32 C 44.5,34 41.5,32.5 38.5,34.5 C 40.5,37 43.5,43.5 42,46 C 39.5,43 34,38.5 32,38.5 C 30,38.5 24.5,43 22,46 C 20.5,43.5 23.5,37 25.5,34.5 C 22.5,32.5 18.5,34 19,32 C 19.5,30 22.5,31.5 25.5,29.5 C 23.5,27 20.5,20.5 22,18 Z"
          fill="url(#drone-core-dark)" />

    <g fill="#1a1b1e" stroke="#ffff0d" stroke-width="1.5" filter="url(#drone-glow-dark)">
      <circle cx="18" cy="18" r="3.8" />
      <circle cx="46" cy="18" r="3.8" />
      <circle cx="46" cy="46" r="3.8" />
      <circle cx="18" cy="46" r="3.8" />
    </g>
    <g fill="#ffffff">
      <circle cx="18" cy="18" r="1.6" />
      <circle cx="46" cy="18" r="1.6" />
      <circle cx="46" cy="46" r="1.6" />
      <circle cx="18" cy="46" r="1.6" />
    </g>

    <circle cx="32" cy="32" r="5.5" fill="#141518" stroke="#ffff0d" stroke-width="1.5" filter="url(#drone-glow-dark)" />
    <circle cx="32" cy="32" r="3.2" fill="#ff7b00" stroke="#ffd000" stroke-width="0.8" />
    <circle cx="31" cy="31" r="1.2" fill="#ffffff" />
    <circle cx="33" cy="33" r="0.6" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- LIGHT MODE DRONE FAVICON (TRANSPARENT BACKGROUND) -->
  <g class="fav-drone-light">
    <g filter="url(#drone-shadow-light)">
      <path d="M 18,6.5 A 11.5,11.5 0 0,0 6.5,18 A 11.5,11.5 0 0,0 18,29.5" fill="none" stroke="#0b3b60" stroke-width="2.8" stroke-linecap="round" />
      <path d="M 18,10.5 A 7.5,7.5 0 0,0 10.5,18 A 7.5,7.5 0 0,0 18,25.5" fill="none" stroke="#ff7b00" stroke-width="2.2" stroke-linecap="round" />
      <path d="M 46,6.5 A 11.5,11.5 0 0,1 57.5,18 A 11.5,11.5 0 0,1 46,29.5" fill="none" stroke="#0b3b60" stroke-width="2.8" stroke-linecap="round" />
      <path d="M 46,10.5 A 7.5,7.5 0 0,1 53.5,18 A 7.5,7.5 0 0,1 46,25.5" fill="none" stroke="#ff7b00" stroke-width="2.2" stroke-linecap="round" />
      <path d="M 46,57.5 A 11.5,11.5 0 0,0 57.5,46 A 11.5,11.5 0 0,0 46,34.5" fill="none" stroke="#0b3b60" stroke-width="2.8" stroke-linecap="round" />
      <path d="M 46,53.5 A 7.5,7.5 0 0,0 53.5,46 A 7.5,7.5 0 0,0 46,38.5" fill="none" stroke="#ff7b00" stroke-width="2.2" stroke-linecap="round" />
      <path d="M 18,57.5 A 11.5,11.5 0 0,1 6.5,46 A 11.5,11.5 0 0,1 18,34.5" fill="none" stroke="#0b3b60" stroke-width="2.8" stroke-linecap="round" />
      <path d="M 18,53.5 A 7.5,7.5 0 0,1 10.5,46 A 7.5,7.5 0 0,1 18,38.5" fill="none" stroke="#ff7b00" stroke-width="2.2" stroke-linecap="round" />
    </g>

    <path d="M 20,16 L 24,19 Q 32,25 40,19 L 44,16 Q 48,20 45,24 Q 39,32 45,40 Q 48,44 44,48 L 40,45 Q 32,39 24,45 L 20,48 Q 16,44 19,40 Q 25,32 19,24 Q 16,20 20,16 Z"
          fill="#0b3b60" stroke="#072842" stroke-width="1.5" stroke-linejoin="round" filter="url(#drone-shadow-light)" />
    <path d="M 22,18 C 24.5,21 30,25.5 32,25.5 C 34,25.5 39.5,21 42,18 C 43.5,20.5 40.5,27 38.5,29.5 C 41.5,31.5 45.5,30 45,32 C 44.5,34 41.5,32.5 38.5,34.5 C 40.5,37 43.5,43.5 42,46 C 39.5,43 34,38.5 32,38.5 C 30,38.5 24.5,43 22,46 C 20.5,43.5 23.5,37 25.5,34.5 C 22.5,32.5 18.5,34 19,32 C 19.5,30 22.5,31.5 25.5,29.5 C 23.5,27 20.5,20.5 22,18 Z"
          fill="url(#drone-core-light)" />

    <g fill="#0b3b60" stroke="#072842" stroke-width="1.5" filter="url(#drone-shadow-light)">
      <circle cx="18" cy="18" r="3.8" />
      <circle cx="46" cy="18" r="3.8" />
      <circle cx="46" cy="46" r="3.8" />
      <circle cx="18" cy="46" r="3.8" />
    </g>
    <g fill="#ff7b00">
      <circle cx="18" cy="18" r="1.8" />
      <circle cx="46" cy="18" r="1.8" />
      <circle cx="46" cy="46" r="1.8" />
      <circle cx="18" cy="46" r="1.8" />
    </g>

    <circle cx="32" cy="32" r="5.5" fill="#072842" stroke="#0b3b60" stroke-width="1.5" filter="url(#drone-shadow-light)" />
    <circle cx="32" cy="32" r="3.2" fill="#ff7b00" />
    <circle cx="31" cy="31" r="1.2" fill="#ffffff" />
  </g>
</svg>